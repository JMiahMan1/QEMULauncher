name: Self-Hosted macOS Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex-qemu-launcher-refactor

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  smoke:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Integrity
        run: python3 qemu_app.py --integrity-check
      - name: Build
        run: ./build.sh self-hosted-smoke
