name: macOS Build and Release

on:
  push:
    branches:
      - "main"
      - "qemu-launcher-refactor"
      - "fix-*"
    tags:
      - "*"
  pull_request:
    branches:
      - "main"
      - "qemu-launcher-refactor"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  APP_NAME: "QEMU Launcher"
  QT_QPA_PLATFORM: "offscreen"
  BRANCH_BUILD_TAG: "qemu-launcher-refactor-build"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck
      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Run Ruff
        run: ruff check .
      - name: Run ShellCheck
        run: shellcheck test_build.sh build.sh

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python3 -m pip install -r requirements.txt
      - name: Run tests
        run: pytest -q

  build-macos:
    needs: test
    runs-on: macos-26
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Dependencies
        run: |
          brew install qemu coreutils
          python3 -m pip install -r requirements.txt
      - name: Build macOS Bundle
        run: |
          chmod +x build.sh
          ./build.sh
      - name: Create DMG Installer
        run: |
          hdiutil create -volname "${{ env.APP_NAME }}" -srcfolder "${{ env.APP_NAME }}.app" -ov -format UDBZ "${{ env.APP_NAME }}.dmg"
      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: "${{ env.APP_NAME }}.dmg"

  build-linux-x86:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rpm
          sudo gem install --no-document fpm
          python3 -m pip install -r requirements.txt
      - name: Build Binary and RPM
        run: |
          python3 -m PyInstaller --noconfirm --clean --onedir --windowed --name "qemu-launcher-linux" qemu_app.py
          VERSION="1.0"
          fpm -s dir -t rpm \
            -n "qemu-launcher" \
            -v "${VERSION}" \
            --iteration "${GITHUB_SHA:0:7}" \
            --description "QEMU Launcher for macOS and Linux VMs" \
            --maintainer "QEMU Launcher" \
            --architecture x86_64 \
            --depends qemu \
            --depends python3 \
            dist/qemu-launcher-linux=/opt/qemu-launcher
      - name: Upload Linux x86 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-rpm-x86
          path: "*.rpm"

  build-linux-arm64:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Host Dependencies (fpm)
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rpm
          sudo gem install --no-document fpm
      - name: Build Binary (Emulated ARM64)
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: aarch64
          base_image: python:3.12-slim-bookworm
          run: |
            python3 -m pip install --upgrade pip
            python3 -m pip install -r requirements.txt
            python3 -m PyInstaller --noconfirm --clean --onedir --windowed --name "qemu-launcher-linux" qemu_app.py
      - name: Build RPM on Host (x86)
        run: |
          VERSION="1.0"
          fpm -s dir -t rpm \
            -n "qemu-launcher" \
            -v "${VERSION}" \
            --iteration "${GITHUB_SHA:0:7}" \
            --description "QEMU Launcher for macOS and Linux VMs" \
            --maintainer "QEMU Launcher" \
            --architecture aarch64 \
            --depends qemu \
            --depends python3 \
            dist/qemu-launcher-linux=/opt/qemu-launcher
      - name: Upload Linux ARM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-rpm-arm64
          path: "*.rpm"

  release:
    needs: [build-macos, build-linux-x86, build-linux-arm64]
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/qemu-launcher-refactor')
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Release Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.ref == 'refs/heads/main' && 'latest-build' || env.BRANCH_BUILD_TAG }}
          name: ${{ github.ref == 'refs/heads/main' && format('Latest Build ({0})', github.sha) || format('Branch Build ({0})', github.sha) }}
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
