name: macOS Build and Release

on:
  push:
    branches:
      - 'main'
      - 'fix-*'
      - 'fix/**'
    tags:
      - '*'
  pull_request:
    branches:
      - 'main'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install Ruff
      run: pip install ruff
    - name: Run Ruff
      run: ruff check .

  build:
    needs: lint
    runs-on: macos-latest
    
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Set Homebrew PATH
      run: |
        echo "PATH=/opt/homebrew/bin:/usr/local/bin:$PATH" >> $GITHUB_ENV
      
    - name: Install and Verify Dependencies
      run: |
        brew install qemu python-tk coreutils
        pip install ruff
        
    - name: Get Version Number
      id: get_version
      run: |
        SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
        if [[ $GITHUB_REF_TYPE == 'tag' ]]; then
          echo "VERSION_NUMBER=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
        elif [[ $GITHUB_REF_NAME == fix-* ]] || [[ $GITHUB_REF_NAME == fix/* ]]; then
          echo "VERSION_NUMBER=1.0-fix-${SHORT_SHA}" >> $GITHUB_ENV
        else
          echo "VERSION_NUMBER=1.0-dev-${SHORT_SHA}" >> $GITHUB_ENV
        fi
      shell: bash

    - name: Run Full Test Suite (Lint + Build)
      run: |
        chmod +x test.sh lint.sh test_build.sh build.sh
        ./test.sh
        
    - name: Package Application
      run: |
        APP_NAME="QEMU Launcher"
        VERSION="${{ env.VERSION_NUMBER }}"
        zip -r -q "${APP_NAME}-${VERSION}-macOS.zip" "${APP_NAME}.app"
        
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: "${APP_NAME}-${{ env.VERSION_NUMBER }}-macOS"
        path: "*.zip"
        retention-days: 5
        
    - name: Create Release
      if: github.ref_type == 'tag'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
        overwrite: true 
        files: "QEMU Launcher-${{ env.VERSION_NUMBER }}-macOS.zip"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
