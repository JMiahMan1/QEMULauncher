name: macOS Build and Release

on:
  push:
    branches:
      - 'main'
      - 'fix-fullscreen-macos'
    tags:
      - '*'
  pull_request:
    branches:
      - 'main'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install Ruff
      run: pip install ruff
    - name: Run Ruff
      run: ruff check .

  build:
    needs: lint
    runs-on: macos-latest
    
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Set Homebrew PATH
      run: |
        echo "PATH=/opt/homebrew/bin:/usr/local/bin:$PATH" >> $GITHUB_ENV
      
    - name: Install and Verify Dependencies
      run: |
        brew install qemu python-tk coreutils
        pip install ruff
        
    - name: Get Version Number
      id: get_version
      run: |
        if [[ $GITHUB_REF_TYPE == 'tag' ]]; then
          echo "VERSION_NUMBER=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
        else
          echo "VERSION_NUMBER=dev-$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV
        fi
      shell: bash

    - name: Run Full Test Suite (Lint + Build)
      run: |
        chmod +x test.sh lint.sh test_build.sh build.sh
        ./test.sh
        
    - name: Package Application
      run: |
        APP_NAME="QEMU Launcher"
        VERSION="${{ env.VERSION_NUMBER }}"
        ARCHIVE_NAME="${APP_NAME}-${VERSION}-macOS.zip"
        APP_BUNDLE_NAME="${APP_NAME}.app"
        
        zip -r -q "$ARCHIVE_NAME" "$APP_BUNDLE_NAME"
        
    - name: Create Release
      if: github.ref_type == 'tag'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
        overwrite: true 
        files: QEMU Launcher-${{ env.VERSION_NUMBER }}-macOS.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
