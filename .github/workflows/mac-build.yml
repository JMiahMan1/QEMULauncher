name: macOS Build and Release

on:
  push:
    branches:
      - "main"
      - "fix-*"
    tags:
      - "*"
  pull_request:
    branches:
      - "main"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  APP_NAME: "QEMU Launcher"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: pip install ruff
      - name: Run Ruff
        run: ruff check .
      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck
      - name: Run ShellCheck
        run: shellcheck launcher.sh test_build.sh build.sh

  test:
    needs: lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install ruff
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run MacOS Logic Tests
        run: python3 tests/test_macos_logic.py

  build-macos:
    needs: test
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set Homebrew PATH
        run: echo "PATH=/opt/homebrew/bin:/usr/local/bin:$PATH" >> $GITHUB_ENV
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Dependencies
        run: |
          brew install qemu coreutils
          pip install pyinstaller ruff
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Build macOS Bundle
        run: |
          chmod +x build.sh
          ./build.sh
      - name: Create DMG Installer
        run: |
          # Create a DMG for distribution
          hdiutil create -volname "${{ env.APP_NAME }}" -srcfolder "${{ env.APP_NAME }}.app" -ov -format UDZO "${{ env.APP_NAME }}.dmg"
      - name: Release macOS Artifact
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix-fullscreen-macos'
        with:
          files: "${{ env.APP_NAME }}.dmg"
          tag_name: "latest-build"
          name: "Latest Build (${{ github.sha }})"
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    needs: test
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller (Host)
        run: pip install pyinstaller ruff
      - name: Build Binary and RPM
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: ${{ matrix.arch }}
          distro: fedora_latest
          run: |
            dnf install -y python3-devel gcc ruby ruby-devel rubygems rpm-build git
            gem install --no-document fpm
            pip3 install pyinstaller ruff
            if [ -f requirements.txt ]; then
              grep -vE "pyobjc|py2app" requirements.txt > requirements_linux.txt
              pip3 install -r requirements_linux.txt || true
            fi
            pyinstaller --onefile --name "qemu-launcher-linux" qemu_app.py
            VERSION="1.0"
            fpm -s dir -t rpm \
              -n "qemu-launcher" \
              -v "${VERSION}" \
              --iteration "${GITHUB_SHA:0:7}" \
              --description "QEMU Launcher for macOS and Linux VMs" \
              --maintainer "Jeremiah Summers" \
              --architecture ${{ matrix.arch }} \
              --depends qemu \
              --depends python3 \
              dist/qemu-launcher-linux=/usr/bin/qemu-launcher
      - name: Release Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix-fullscreen-macos'
        with:
          files: |
            *.rpm
          tag_name: "latest-build"
          name: "Latest Build (${{ github.sha }})"
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
