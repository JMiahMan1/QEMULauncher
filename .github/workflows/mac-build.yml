name: macOS Build and Release

on:
  push:
    branches:
      - "main"
      - "qemu-launcher-refactor"
      - "fix-*"
    tags:
      - "*"
  pull_request:
    branches:
      - "main"
      - "qemu-launcher-refactor"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  APP_NAME: "QEMU Launcher"
  QT_QPA_PLATFORM: "offscreen"
  BRANCH_BUILD_TAG: "qemu-launcher-refactor-build"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck
      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Run Ruff
        run: ruff check .
      - name: Run ShellCheck
        run: shellcheck test_build.sh build.sh

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python3 -m pip install -r requirements.txt
      - name: Run tests
        run: pytest -q

  build-macos:
    needs: test
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Dependencies
        run: |
          brew install qemu coreutils
          python3 -m pip install -r requirements.txt
      - name: Build macOS Bundle
        run: |
          chmod +x build.sh
          ./build.sh
      - name: Create DMG Installer
        run: |
          # Create a DMG for distribution
          hdiutil create -volname "${{ env.APP_NAME }}" -srcfolder "${{ env.APP_NAME }}.app" -ov -format UDZO "${{ env.APP_NAME }}.dmg"
      - name: Release macOS Artifact
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/qemu-launcher-refactor'
        with:
          files: "${{ env.APP_NAME }}.dmg"
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.ref == 'refs/heads/main' && 'latest-build' || env.BRANCH_BUILD_TAG }}
          name: ${{ github.ref == 'refs/heads/main' && format('Latest Build ({0})', github.sha) || format('Branch Build ({0})', github.sha) }}
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux-x86:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rpm
          sudo gem install --no-document fpm
          python3 -m pip install -r requirements.txt
      - name: Build Binary and RPM
        run: |
          python3 -m PyInstaller --noconfirm --clean --onedir --windowed --name "qemu-launcher-linux" qemu_app.py
          VERSION="1.0"
          fpm -s dir -t rpm \
            -n "qemu-launcher" \
            -v "${VERSION}" \
            --iteration "${GITHUB_SHA:0:7}" \
            --description "QEMU Launcher for macOS and Linux VMs" \
            --maintainer "QEMU Launcher" \
            --architecture x86_64 \
            --depends qemu \
            --depends python3 \
            dist/qemu-launcher-linux=/opt/qemu-launcher
      - name: Release Artifacts
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/qemu-launcher-refactor'
        with:
          files: "*.rpm"
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.ref == 'refs/heads/main' && 'latest-build' || env.BRANCH_BUILD_TAG }}
          name: ${{ github.ref == 'refs/heads/main' && format('Latest Build ({0})', github.sha) || format('Branch Build ({0})', github.sha) }}
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux-arm64:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Build Binary and RPM
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: aarch64
          distro: fedora_latest
          run: |
            dnf install -y python3-devel gcc ruby-devel rubygems rpm-build git tk-devel tcl-devel
            gem install --no-document fpm
            python3 -m pip install -r requirements.txt
            python3 -m PyInstaller --noconfirm --clean --onedir --windowed --name "qemu-launcher-linux" qemu_app.py
            VERSION="1.0"
            fpm -s dir -t rpm \
              -n "qemu-launcher" \
              -v "${VERSION}" \
              --iteration "${GITHUB_SHA:0:7}" \
              --description "QEMU Launcher for macOS and Linux VMs" \
              --maintainer "QEMU Launcher" \
              --architecture aarch64 \
              --depends qemu \
              --depends python3 \
              dist/qemu-launcher-linux=/opt/qemu-launcher
      - name: Release Artifacts
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/qemu-launcher-refactor'
        with:
          files: "*.rpm"
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.ref == 'refs/heads/main' && 'latest-build' || env.BRANCH_BUILD_TAG }}
          name: ${{ github.ref == 'refs/heads/main' && format('Latest Build ({0})', github.sha) || format('Branch Build ({0})', github.sha) }}
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
